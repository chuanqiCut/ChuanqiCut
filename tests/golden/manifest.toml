category = "codec"
resolution = "1080p"
width = 1920
height = 1080
fps = 30
frame_count = 90
# ⚠️ 实测值 4.466667s，≠ frame_count/fps(3.0)。这是 VFR 的固有属性：
#    间隔在 1tick(30fps)/2tick(15fps) 间交替，实际时长必然长于名义时长。
#    分布实测：0.03333s × 46，0.06667s × 42。不得按 3.0 回填。
duration_s = 4.466667
pattern = "smptebars"
codec = "h264"
gop_size = 30
bframes = 0
vfr = true
rotation = 0
audio = false
use_case = "可变帧率时间戳正确性（与恒定帧率比对）"
file_glob = "frames/gf_1080p_vfr.mp4"
requires = "ffmpeg"
status = "built"
note = "VFR 是 pts/duration 属性，PNG 序列无法表达；需 ffmpeg"

