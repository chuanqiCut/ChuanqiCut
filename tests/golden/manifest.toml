# ChuanqiCut — Golden Frame 样本库清单 (QA-001)
#
# 本文件是 golden 样本库的「真源」：generate.py 与 verify.py 都读取它。
# 命名规范见 README.md。
#
# 字段说明（每个 [[sample]]）：
#   id            全局唯一 ID，同时是 frames/<id>/ 目录名
#   category      素材类别（solid / colorref / extreme / motion / codec）
#   resolution    逻辑分辨率标签：720p / 1080p / 4k
#   width,height  像素尺寸
#   fps           名义帧率（PNG 序列为意图播放率；VFR 见 vfr 字段）
#   frame_count   帧数
#   duration_s    名义时长 = frame_count / fps
#   pattern       生成器用的图案类型（generate.py 据此绘制）
#   codec         介质编码：raw_png（合成帧）/ h264 / hevc
#   gop_size      关键帧间隔（仅编码样本，PNG 无意义填 0）
#   bframes       B 帧数（仅编码样本）
#   vfr           true=可变帧率
#   rotation      旋转 metadata（度）
#   audio         true=带音轨
#   use_case      验收用途（测哪个环节）
#   file_glob     相对 tests/golden/ 的文件匹配
#   requires      生成所需工具：python-png（本机可用）/ ffmpeg（本机缺失）
#   status        built（已生成）/ unbuilt（待补，缺编码器）
#   note          备注

schema_version = "1.0"
library = "chuanqi-cut-golden"
purpose = "预览渲染与导出走同一张 RenderGraph 的 PSNR/SSIM 比对基准 (ARCH-001 §9 / ARCH-003 §9)"

# 本机生成实际使用的路径（verify.py 会核对并回显）。
#   python-png : 纯标准库 PNG 序列合成（无 ffmpeg 依赖）
#   ffmpeg     : 编码类样本用 ffmpeg 生成（tessus 静态构建 6.1.1，仅用于测试夹具）
generator_path = "python-png + ffmpeg(tessus 6.1.1 仅作测试夹具)"

# 提交策略（team-lead 决策，见 README §7）：本 manifest 登记的夹具随仓库提交，
# 属于「基准/测试资产」而非 AGENTS.md 禁止的「生成媒体」产物；总体积保持 <=10MB。
commit_policy = "fixtures registered here are committed with the repo; keep total <=10MB"

# ！！！ffmpeg 工具约束（team-lead 拍板）！！！
# 本仓库所用的 ffmpeg 二进制（evermeet.cx tessus 静态构建 6.1.1，含 GPL/libx264/libx265）
# 只准用于【生成测试夹具】，绝对不能：
#   1) 链接进任何发布产物 / SDK 构建；
#   2) 当作 FFmpeg 体积或符号基线的数据源（那是 DEPS-013 用自研 demux 档位构建测的）。
# 脚本中通过环境变量 CQ_FFMPEG_BIN / CQ_FFPROBE_BIN 覆盖路径，默认指向
# /Users/zhuning/.workbuddy/binaries/ffmpeg/bin/。

# ---- 目标验收维度（本库要覆盖的） ----
target_dimensions = [
  "resolution: 720p / 1080p / 4k",
  "codec: h264 / hevc (requires ffmpeg, 见 unbuilt)",
  "long-GOP with B-frames (requires ffmpeg)",
  "variable frame rate / VFR (requires ffmpeg)",
  "rotation metadata (requires ffmpeg)",
  "with audio track (requires ffmpeg)",
  "extreme: pure black / pure white / high-dynamic stripes / fine texture / fractal",
  "color reference: SMPTE 75% bars (primaries / matrix)",
  "motion: multi-frame seek / temporal stability",
]

