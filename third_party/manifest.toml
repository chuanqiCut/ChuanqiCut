# =============================================================================
# ChuanqiCut 第三方依赖清单（manifest.toml）
# -----------------------------------------------------------------------------
# 真源：docs/specs/ARCH-002-依赖治理与开源SDK能力管理.md
# 本文件「人写」：要什么、什么协议、什么档位、源码还是二进制。
# 机器锁定的 commit / 校验和 / 产物路径由 deps.lock 记录（DEPS-002，禁止手改）。
#
# 字段速查（详见 tools/deps/schema.py）：
#   name        依赖名（也作为 CMake target `cq::<name>` 的基底），必须唯一
#   version     语义化版本 / tag
#   upstream    来源 URL（主机必须在 SOURCE_REGISTRY 白名单，否则「来源未登记」）
#   license     SPDX 表达式（不接受自由文本），解析器会给出 ALLOW/REVIEW/RESTRICTED 分级
#   integration source | binary | auto
#                   source = 源码集成（可调试/打补丁）
#                   binary = 二进制集成（预编译产物 + 校验和，见 [[dep.artifact]]）
#                   auto   = 本地用 binary（快），CI/发布用 source（可审计）
#   visibility  public | private  —— private 表示第三方符号不得泄漏到公共头（DEPS-004 扫描）
#   owner       负责团队/模块
#   platforms   子集 of [apple, android, ohos, host]
#   scope       runtime(默认) | build —— build 表示仅构建期工具链，不进入产物（ARCH-002 未显式定义，本 schema 扩展）
#   profile     能力档位（库相关，见 ARCH-002 §3，以 FFmpeg 为核心案例）
#   features    该档位下启用的能力（必须与 profile 兼容，否则「档位声明矛盾」）
#   strip       是否 strip 非导出符号（默认 true）
#   artifact    二进制集成的预编译产物列表（platform/url/sha256，校验和必填）
# =============================================================================

# -----------------------------------------------------------------------------
# 1) FFmpeg —— demux 档位（默认），源码 + 二进制双集成
#    协议 LGPL-2.1-or-later → REVIEW 级（需附加义务处置，见 ARCH-002 §5.1）
#    demux 档位：libavformat + libavutil + avcodec 的 parser/bsf 部分，绝无 GPL 符号。
#
#    ⚠️ 关于体积（2026-09-25 由 team-lead 修订，勿改回硬阈值）：
#      此前这里写的是「< 3MB」。那是把**体积当成约束**去反推该裁哪些格式 —— 本末倒置：
#      会为了凑一个拍脑袋的数字而砍掉用户真正需要的能力（例如单张图片输入）。
#      正确顺序是反过来：**先按实际需求定组件范围（可按需增减），体积是裁剪的结果**。
#      实测体积只记入 .ai/memory/baselines.md 作为**参考基准**，不设硬阈值、不因此让门禁失败。
#      schema.py 的 FFMPEG_PROFILES["demux"].note 已同步去掉该数字，两处保持一致。
#
# ---------------------------------------------------------------------------
# 拉取策略（ADR-0008）：本地 git 管理 + 定期 bump，**不跟随分支 HEAD**
#   upstream  使用 FFmpeg 官方 GitHub 镜像（ffmpeg.org 下载页登记为
#              "Mirror of the main repository"），国内可达性与 CI 拉取速度优于
#              git.ffmpeg.org（后者仍是 canonical upstream）。
#   pin       必须是 commit。tag / 分支名都是**可变引用**，tag 可被 upstream
#              force-push，跟随它们会失去可复现构建 —— 同一份源码今天编译和
#              明天编译可能得到不同的 demux 行为，golden 测试会莫名失败。
#   定期拉最新 = 由人（或定时任务）执行 bump，改 pin_ref 到新 commit，
#              走完整 CI + golden 回归后合入。**不是** CI 自动跟随。
# ---------------------------------------------------------------------------
[[dep]]
name        = "ffmpeg"
version     = "9.0.2"
upstream    = "https://github.com/FFmpeg/FFmpeg.git"
vcs         = "git"
pin         = "commit"
pin_ref     = "946fcce07b6dcd0331c8cc609192aeff5e1924f8"   # tag n9.0.2 解引用后的 commit
bump_policy = "human"
license     = "LGPL-2.1-or-later"
license_note = "仅当启用 profile=full 且链接 libx264 时整体升为 GPL-2.0-only，需 ADR + 法务审批"
integration = "auto"            # 本地开发走 binary，CI/发布走 source
profile     = "demux"
features    = ["demux", "seek", "probe", "bitstream-filter"]
platforms   = ["apple", "android", "ohos"]
visibility  = "private"         # 第三方符号不得出现在 core/include/cq/**
owner       = "media"
strip       = true

# binary 路径的预编译产物（DEPS-010：本地构建「常用子集」档位 demux only，产物目录 prebuilt/apple-x86_64-demux）
# 说明：本地开发走 binary（auto 集成），CI/发布走 source；arm64 产物由 DEPS-011/012 在对应平台回填。
# 本机构建档位 = 常用子集（libavformat + libavutil + avcodec 的 parser/bsf 部分），LGPL-2.1+，无 GPL 符号，
#   启用 17 demuxers / 13 parsers / 5 bsfs（在 slim 的 16 基础上补回 image_webp_pipe，以内容方式识别 WebP；
#   见 baselines.md「常用档位（profile=demux 的实现）」的 WebP 实测结论）。
# 体积说明：常用子集档位实测合并产物 2,325,424 B（≈2.22MiB），见 baselines.md。
#   **本档位不设硬性体积上限**（2026-09-25 由 team-lead 修订：原 `< 3MB` 约束已废除）；体积仅作参考基准、如实记录。
#
# ⚠️ url 字段说明：产物为**本地构建**（prebuilt/<dir> 下），并非托管在制品服务器。
#   原写的 url="https://artifacts.internal/chuanqicut/ffmpeg/..." 是虚构域名（仅存在于 selfcheck.py/ARCH-002/manifest 注释示例），
#   没有任何真实制品服务器在托管本产物，故不能照抄。保留 url 字段仅为满足 schema 必填约束，
#   其取值 = 本地路径标记，真实来源见 `path` 与 baselines.md 的构建命令；CI/发布走 source 集成由上游 commit 审计。
[[dep.artifact]]
platform = "apple-x86_64"
url      = "local-build://prebuilt/apple-x86_64-demux"   # 本地构建产物，非托管的制品 URL（见上方说明）
sha256   = "e1850cd2726005e80c31bf721d8392fcb7813ff5f259bb5bd9c49c536bcf110b"
path     = "prebuilt/apple-x86_64-demux"
size_bytes = 2325424

# -----------------------------------------------------------------------------
# 2) signalsmith-stretch —— 音频时间拉伸 / 变声（含 formant 补偿）
#    协议 MIT → ALLOW 级；C++11 header-only，源码集成
#    替代 SoundTouch（实为 LGPL，原调研误标 MIT，见 ADR-0004）
#    ⚠️ 上游**没有任何 tag/release**（ls-remote --tags 返回 0 条），因此 version
#       不能写成 "1.0" 这种伪版本号 —— 只能以 commit 标识。
[[dep]]
name        = "signalsmith-stretch"
version     = "git-57b93f4"
upstream    = "https://github.com/signalsmith-audio/signalsmith-stretch"
vcs         = "git"
pin         = "commit"
pin_ref     = "57b93f4e9206a089a45387eaa39bdc9f310d3308"   # main HEAD，上游无 release tag
bump_policy = "human"
license     = "MIT"
license_note = "header-only；构建时需规避 AppleClang16 + -ffast-math 组合（见 ADR-0004）"
integration = "source"
platforms   = ["apple", "android", "ohos"]
visibility  = "private"
owner       = "audio"
strip       = true

# -----------------------------------------------------------------------------
# 3) glslang —— GLSL → SPIR-V（构建期工具链，仅主机运行，不进产物）
#    协议 BSD-3-Clause / Apache-2.0 → ALLOW 级
#    scope=build：见 schema 扩展说明（ARCH-002 未显式定义构建期依赖维度）
# -----------------------------------------------------------------------------
[[dep]]
name        = "glslang"
version     = "16.0.0"
upstream    = "https://github.com/KhronosGroup/glslang"
vcs         = "git"
pin         = "commit"
pin_ref     = "a57276bf558f5cf94d3a9854ebdf5a2236849a5a"   # tag 16.0.0（轻量 tag，本身即 commit）
bump_policy = "human"
license     = "BSD-3-Clause"
integration = "source"
scope       = "build"          # 仅在构建机运行，产物中不含其代码
platforms   = ["host"]
visibility  = "private"
owner       = "shader"
strip       = true

# -----------------------------------------------------------------------------
# 4) SPIRV-Cross —— SPIR-V → MSL / GLSL ES（构建期工具链，同上）
#    协议 Apache-2.0 → ALLOW 级
#    ⚠️ 上游**无 tag/release**（ls-remote --tags 无结果），原写 "1.3.296.0" 无法核对，
#       已改为按 commit 锁定。
# -----------------------------------------------------------------------------
[[dep]]
name        = "SPIRV-Cross"
version     = "git-aa217ae"
upstream    = "https://github.com/KhronosGroup/SPIRV-Cross"
vcs         = "git"
pin         = "commit"
pin_ref     = "aa217aeb6c9f0ace7a0ab233b28807edf45eb165"   # main HEAD
bump_policy = "human"
license     = "Apache-2.0"
integration = "source"
scope       = "build"
platforms   = ["host"]
visibility  = "private"
owner       = "shader"
strip       = true

# -----------------------------------------------------------------------------
# 5) Oboe —— Android 低延迟音频（仅 Android 运行时依赖）
#    协议 Apache-2.0 → ALLOW 级；AAudio 优先，OpenSL 回退
#    ⚠️ 原写 version="1.9.2" —— 该 tag **不存在**（上游只有 1.9.0 / 1.9.3），已改为 1.9.3。
# -----------------------------------------------------------------------------
[[dep]]
name        = "oboe"
version     = "1.9.3"
upstream    = "https://github.com/google/oboe"
vcs         = "git"
pin         = "commit"
pin_ref     = "b15f5e39c01a7ada306d959e5129620b145fb8b4"   # tag 1.9.3
bump_policy = "human"
license     = "Apache-2.0"
integration = "source"
platforms   = ["android"]
visibility  = "private"
owner       = "audio"
strip       = true

# -----------------------------------------------------------------------------
# 6) LiteRT（原 TensorFlow Lite）—— 端侧推理运行时，二进制集成
#    协议 Apache-2.0 → ALLOW 级
#    注意区分两件事（ADR-0005）：引入的是 **模型资产**，不是 MediaPipe SDK。
#    本条登记的是 **运行时本身**，各端地位不同，别搞混：
#      - Android：LiteRT 是**主路径**（NNAPI / GPU / XNNPACK），不是回退。
#      - Apple：主路径是 coremltools 转 .mlpackage 走 CoreML（路径 A，零第三方运行时）；
#               LiteRT + CoreML delegate 只是**回退路径 B**，是否启用取决于 AI-013 spike 结果。
#    因此 platforms 暂只标 android；若 AI-013 未过而切路径 B，需在此追加 apple 并走 ADR 变更。
# -----------------------------------------------------------------------------
[[dep]]
name        = "tflite"
version     = "2.16.1"
upstream    = "https://github.com/tensorflow/tensorflow"
vcs         = "git"
pin         = "commit"
pin_ref     = "5bc9d26649cca274750ad3625bd93422617eed4b"   # tag v2.16.1 解引用后的 commit（GitHub API 核对，2024-03-06）
bump_policy = "human"
license     = "Apache-2.0"
integration = "auto"           # 计划为 android-arm64-v8a 预编译二进制；先锁源码 commit，二进制产物待 DEPS-011/012 在设备上回填
platforms   = ["android"]
visibility  = "private"
owner       = "ai"
strip       = true
# ⚠️⚠️ integration/pin_ref 的真实语义，读的人务必先看这段 ⚠️⚠️
# 这里的 `integration="auto"` + `pin=commit` **只用于「版本锚定」，不是构建来源声明**。
#
# 【禁止】不要试图从 tensorflow/tensorflow 源码 checkout 并构建 TFLite：
#   该仓库 checkout 后达数 GB，且官方只有 Bazel 构建路径，单次构建数小时，
#   不可能落进 third_party/src/，也不在我们的工具链范围内。`upstream` 字段在此仅用于
#   指认「LITE RT 2.16.1 对应哪个 commit」，供合规审计与版本溯源使用。
#
# 【真实来源】产物必须来自官方预编译包 —— Maven Central 的
#   org.tensorflow:tensorflow-lite(-gpu/-metadata) AAR，或 Google 官方 release，
#   从中提取对应 ABI 的库文件。禁止自编译。
#
# 【待办】DEPS-011/012 需在目标设备上来实测：下载上述预编译包 → 提取 android-arm64-v8a 产物
#   → 哈希 + 量体积 → 回填成 [[dep.artifact]]，并**把 integration 改回 "binary"**。
#   回填后本注释的「版本锚定」临时状态即告结束。
#
# 【为什么现在是这个别扭的形态】原形态是 `integration="binary"` + 占位 sha256(2222…)，
#   那等于声明一个我们明知不存在的产物：既让 check/lock 永久失败（长期红灯会训练所有人
#   无视红色），又误导读者以为产物已就绪。而 parser 要求 binary 必须带 ≥1 个 artifact，
#   不能只删 artifact 留空壳。故在「真实产物就绪」之前，用 auto + pin_ref 作纯版本锚点，
#   是既不让门禁假红、又不虚构产物两者的折中。**这不是终态，是 bring-up 期的临时形态。**
notes       = "占位 artifact（sha256=2222… 全同字符）已删除：声明不存在的预编译产物比不声明更糟，会让门禁长期红。当前以 auto 路径锁定到 TF v2.16.1 真实 commit 作为**纯版本锚点**（严禁从此源构建，见上方注释）；android-arm64-v8a 的预编译产物由 DEPS-011/012 从官方 Maven AAR / release 提取并实测体积/校验和后，再作为 [[dep.artifact]] 回填，届时 integration 改回 binary。"

# -----------------------------------------------------------------------------
# 7) doctest —— 内核单测框架（构建期 + 测试期依赖，仅主机）
#    协议 MIT → ALLOW 级；header-only，单头文件，无预编译依赖
#
#    ✅ **选型已定**（INFRA-002 决定）：doctest 而非 GoogleTest / Catch2 v3。
#       理由：header-only 零预编译依赖，最贴合「减少依赖治理负担」；相比 Catch2 v3 需要
#       多 target 链接更轻。原此处登记的是 googletest 作为占位，已替换，不得两套并存。
#    ⚠️ INFRA-002 **尚未实际把 doctest 源码接进仓库** —— 那是故意的，不是遗漏：
#       红线 #10 禁止直接把第三方代码拷进仓库，必须先有 manifest 登记 + 引入流程。
#       因此当前 tests/ 里是框架无关的 smoke 用例（static_assert + main），
#       待本条落地后替换成正式 TEST_CASE。
# -----------------------------------------------------------------------------
[[dep]]
name        = "doctest"
version     = "2.5.3"
upstream    = "https://github.com/doctest/doctest"
vcs         = "git"
pin         = "commit"
pin_ref     = "2d0a9359a60c51affe2a9bebb1be1dca47868151"   # tag v2.5.3（最新）
bump_policy = "human"
license     = "MIT"
integration = "source"
scope       = "build"
platforms   = ["host"]
visibility  = "private"
owner       = "infra"
strip       = true
notes       = "单头文件只需取 doctest.h，不需要整个仓库；接入方式待 DEPS 引入流程确定"
