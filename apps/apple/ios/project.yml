# ChuanqiCut iOS App 工程（UIA-002 建立，INFRA-009 拆分为独立工程）
#
# 生成流程（clone 后 / 修改本文件后，在 apps/apple/ios/ 下执行）：
#   xcodegen generate
#   bundle install && bundle exec pod install
#   open ChuanqiCut.xcworkspace      # 注意开 workspace，不是 xcodeproj
#
# xcodegen 安装（本机无 brew）：取 GitHub Release 二进制，不要从源码编。
#   curl -sL -o /tmp/xcodegen.zip \
#     https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
#   unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_bin
#   sudo cp /tmp/xcodegen_bin/xcodegen/bin/xcodegen /usr/local/bin/
#
# ChuanqiCut.xcodeproj 与 .xcworkspace 均为生成产物，不入库。
# 依赖（SDK + SharedUI）全部走 CocoaPods，见同目录 Podfile；本工程不含 SPM 包。

name: ChuanqiCut
options:
  bundleIdPrefix: com.chuanqi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.1"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # xcodegen 2.46 不再默认写 PRODUCT_NAME；缺了它 Xcode 会解析出空名，
    # 报 `Multiple commands produce '.../Build/Products/.../.app'`。
    PRODUCT_NAME: "$(TARGET_NAME)"
    # Xcode 26 对传统 headermap 的弃用提示（否则每次构建一条 warning）。
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    # App target 自己的 DEBUG 编译条件（UIA-032）：SharedUI pod 由 CocoaPods
    # 默认注入 DEBUG，但 App target 原本没有 —— `#if DEBUG` 代码（启动冒烟
    # 钩子等）会被静默剥掉。xcodegen 不默认写这条。
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  ChuanqiCutApp:
    type: application
    platform: iOS
    # 收录 iOSApp；CIKernel 的 .metal 排除在 Sources 之外（见下方脚本说明）。
    sources:
      # 内核头文件浏览引用（2026-10-07，传哲：头文件在工程看不到）：蓝色文件夹引用，
      # 不参与编译（buildPhase: none）——编译走 Engine Pod 的 HEADER_SEARCH_PATHS。
      - path: ../../../engine/core/include
        type: folder
        buildPhase: none
      - path: iOSApp
        excludes:
          - "**/beauty_bilateral.metal"
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: ChuanqiCut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 后台播放 / 画中画（UIA-015 播放器：AVAudioSession .playback +
        # 退后台自动 PiP 的前置声明）
        UIBackgroundModes:
          - audio
        # 相机模块权限（CAM-002/004，ADR-0014；plist 由本文件生成，不存手工副本）
        NSCameraUsageDescription: 需要使用相机进行拍摄与实时特效预览
        NSMicrophoneUsageDescription: 录制视频需要使用麦克风采集声音
        NSPhotoLibraryAddUsageDescription: 用于将录制完成的视频保存到相册
        # 自研相册浏览器读权限（UIA-013，Spec UIA-013 §4.2；ADR-0015 决策 3：
        # 显式偏离系统 picker 的零权限惯例）
        NSPhotoLibraryUsageDescription: 从相册选择视频导入编辑器需要读取照片图库
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chuanqi.cut
        TARGETED_DEVICE_FAMILY: "1,2"
    # CoreImage kernel 不能走 Xcode 内建 Metal 阶段（见 sources 的 excludes）：
    #   1) 编译必须带 -fcikernel，否则 coreimage::sampler 的 sample/coord/extent
    #      是未解析引用；
    #   2) 链接必须用 `xcrun metallib`，不能用 `metal` 驱动 —— 实测后者对
    #      -fcikernel 的 .air 必报
    #      `air-lld: symbol(s) not found for target 'air64_v25-apple-ios16.0.0-simulator'`，
    #      而 `xcrun metallib` 链接同一份 .air 成功（CoreImage 符号运行时解析）。
    # 故这里自己编，产物直接落进 .app（签名在所有 build phase 之后，安全）。
    # BeautyKernel 扫描 bundle 内任意 .metallib，不要求叫 default.metallib。
    #
    # ⚠️ 2026-10-07（ADR-0031 阶段 4 / INFRA-018）：相机源码已迁 ChuanqiCutCamera Pod，
    # 但 metallib 构建管线**留在壳工程**（INFRA-018 实测定案）：静态库 Pod 的
    # script_phase 产物到不了 App bundle（Copy Pods Resources 只拷 install 期声明
    # 的资源；且未声明 inputs/outputs 的 script_phase 在增量构建被跳过）。
    # SRC 指向 Pod 内的 .metal 源（唯一真源），产物直落 .app。
    postBuildScripts:
      - name: "Compile CoreImage metal kernel into bundle"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$PROJECT_DIR/../packages/ChuanqiCutCamera/Sources/ChuanqiCutCameraImpl/Effects/beauty_bilateral.metal"
          AIR="$TARGET_TEMP_DIR/beauty_bilateral.air"
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/beauty_bilateral.metallib"
          mkdir -p "$TARGET_TEMP_DIR"
          case "$PLATFORM_NAME" in
            *simulator) TRIPLE="air64-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}-simulator" ;;
            *)          TRIPLE="air64-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}" ;;
          esac
          # 编译与链接**都要** -fcikernel（96B 空壳案底见 ADR-0021）；
          # 不依赖 $SDKROOT 环境变量，显式按 PLATFORM_NAME 解析 sysroot。
          SYSROOT="$(xcrun --sdk "$PLATFORM_NAME" --show-sdk-path)"
          xcrun -sdk "$PLATFORM_NAME" metal -fcikernel -target "$TRIPLE" -isysroot "$SYSROOT" -c "$SRC" -o "$AIR"
          xcrun -sdk "$PLATFORM_NAME" metal -fcikernel -target "$TRIPLE" -isysroot "$SYSROOT" -o "$OUT" "$AIR"
          # CAM-013 美型 warp kernel（同一编译纪律，独立 metallib 便于 FaceWarp
          # 按自身 kernel 名扫描；加载失败 = 美型跳过，诚实降级）。
          SRC_WARP="$PROJECT_DIR/../packages/ChuanqiCutCamera/Sources/ChuanqiCutCameraImpl/Effects/face_warp.metal"
          AIR_WARP="$TARGET_TEMP_DIR/face_warp.air"
          OUT_WARP="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/face_warp.metallib"
          xcrun -sdk "$PLATFORM_NAME" metal -fcikernel -target "$TRIPLE" -isysroot "$SYSROOT" -c "$SRC_WARP" -o "$AIR_WARP"
          xcrun -sdk "$PLATFORM_NAME" metal -fcikernel -target "$TRIPLE" -isysroot "$SYSROOT" -o "$OUT_WARP" "$AIR_WARP"

# 显式声明 scheme（INFRA-018，2026-10-07）：此前 ChuanqiCutApp scheme 一直依赖
# Xcode 在 xcuserdata 里自动创建，xcodegen 重新生成工程后即丢失 —— 曾导致用
# 自动补的 "ChuanqiCut" scheme 构建出现「BUILD SUCCEEDED 但 App target 零 phase」
# 的假成功。显式声明后不再依赖本机 xcuserdata 状态。
schemes:
  ChuanqiCutApp:
    build:
      targets:
        ChuanqiCutApp: all
    run:
      config: Debug
