# ChuanqiCut macOS App 工程（UIA-002 建立，INFRA-009 拆分为独立工程）
#
# 生成流程（clone 后 / 修改本文件后，在 apps/apple/mac/ 下执行）：
#   xcodegen generate
#   bundle install && bundle exec pod install
#   open ChuanqiCut.xcworkspace      # 注意开 workspace，不是 xcodeproj
#
# xcodegen 安装（本机无 brew）：取 GitHub Release 二进制，不要从源码编。
#   curl -sL -o /tmp/xcodegen.zip \
#     https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
#   unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_bin
#   sudo cp /tmp/xcodegen_bin/xcodegen/bin/xcodegen /usr/local/bin/
#
# ChuanqiCut.xcodeproj 与 .xcworkspace 均为生成产物，不入库。
# 依赖（SDK + SharedUI）全部走 CocoaPods，见同目录 Podfile；本工程不含 SPM 包。

name: ChuanqiCut
options:
  bundleIdPrefix: com.chuanqi
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.1"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # xcodegen 2.46 不再默认写 PRODUCT_NAME；缺了它 Xcode 会解析出空名，
    # 报 `Multiple commands produce '.../Build/Products/.../.app'`（同 iOS 端 P53）。
    PRODUCT_NAME: "$(TARGET_NAME)"
  configs:
    # 同 iOS 端（UIA-032）：App target 的 DEBUG 编译条件，xcodegen 不默认写。
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  ChuanqiCutMacApp:
    type: application
    platform: macOS
    sources: [MacApp]
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleDisplayName: ChuanqiCut
        # 自研相册浏览器读权限（UIA-013；macOS 同样走 Photos 框架读照片图库）
        NSPhotoLibraryUsageDescription: 从照片图库选择视频导入编辑器需要读取照片图库
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chuanqi.cutmac
        # 本机开发用 ad-hoc 签名即可构建运行；分发签名后续任务处理
        CODE_SIGN_IDENTITY: "-"

# 显式声明 scheme（INFRA-018，2026-10-07；缘由见 iOS project.yml 尾注）
schemes:
  ChuanqiCutMacApp:
    build:
      targets:
        ChuanqiCutMacApp: all
    run:
      config: Debug
